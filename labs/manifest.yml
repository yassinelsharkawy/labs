        name: "Coupon Code Multiple Redemption"
        route_prefix: "/lab/logic/logic-01"
        solution_file: "solutions/04-business-logic-race-conditions/lab-16.md"
        difficulty: "Intermediate"
        cwe: "CWE-362"
      - id: "lab-17"
        number: 17
        name: "Concurrent Duplicate Refund Processing"
        route_prefix: "/lab/logic/logic-02"
        solution_file: "solutions/04-business-logic-race-conditions/lab-17.md"
        difficulty: "Intermediate"
        cwe: "CWE-362"
      - id: "lab-18"
        number: 18
        name: "Invitation Acceptance Exceeding Seat Limit"
        route_prefix: "/lab/logic/logic-03"
        solution_file: "solutions/04-business-logic-race-conditions/lab-18.md"
        difficulty: "Intermediate"
        cwe: "CWE-362"
      - id: "lab-19"
        number: 19
        name: "Parallel Verification Token Consumption"
        route_prefix: "/lab/logic/logic-04"
        solution_file: "solutions/04-business-logic-race-conditions/lab-19.md"
        difficulty: "Intermediate"
        cwe: "CWE-362"
      - id: "lab-20"
        number: 20
        name: "Subscription Downgrade State Inconsistency"
        route_prefix: "/lab/logic/logic-05"
        solution_file: "solutions/04-business-logic-race-conditions/lab-20.md"
        difficulty: "Intermediate"
        cwe: "CWE-840"

  - id: "05-ssrf"
    name: "Server-Side Request Forgery"
    labs:
      - id: "lab-21"
        number: 21
        name: "Image Importer SSRF to Internal Metadata"
        route_prefix: "/lab/ssrf/ssrf-01"
        solution_file: "solutions/05-ssrf/lab-21.md"
        difficulty: "Intermediate"
        cwe: "CWE-918"
      - id: "lab-22"
        number: 22
        name: "Webhook Tester SSRF to Internal Services"
        route_prefix: "/lab/ssrf/ssrf-02"
        solution_file: "solutions/05-ssrf/lab-22.md"
        difficulty: "Intermediate"
        cwe: "CWE-918"
      - id: "lab-23"
        number: 23
        name: "Report Generator SSRF via Document URL"
        route_prefix: "/lab/ssrf/ssrf-03"
        solution_file: "solutions/05-ssrf/lab-23.md"
        difficulty: "Intermediate"
        cwe: "CWE-918"
      - id: "lab-24"
        number: 24
        name: "SSRF via Redirect Bypass of URL Allowlist"
        route_prefix: "/lab/ssrf/ssrf-04"
        solution_file: "solutions/05-ssrf/lab-24.md"
        difficulty: "Advanced"
        cwe: "CWE-918"
      - id: "lab-25"
        number: 25
        name: "SSRF via URL Parsing Inconsistency"
        route_prefix: "/lab/ssrf/ssrf-05"
        solution_file: "solutions/05-ssrf/lab-25.md"
        difficulty: "Advanced"
        cwe: "CWE-918"
